<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Weave Studio - Pro Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f111a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Hardware Accelerated Cinematic Animation */
        @keyframes cinematicPan {
            0% { transform: scale(1.0) translate(0, 0); filter: brightness(0.8); }
            20% { filter: brightness(1.1); }
            100% { transform: scale(1.15) translate(-2%, -2%); filter: brightness(1.0); }
        }
        .animate-cinematic-pan {
            animation: cinematicPan 15s ease-in-out forwards;
            will-change: transform, filter; 
        }
        
        .ratio-16-9 { aspect-ratio: 16 / 9; width: 100%; }
        .ratio-9-16 { aspect-ratio: 9 / 16; width: 56.25%; margin: 0 auto; }
        .ratio-1-1 { aspect-ratio: 1 / 1; width: 75%; margin: 0 auto; }
    </style>
</head>
<body class="p-3 md:p-6 text-sm md:text-base">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-5">
        
        <!-- Left Column: Command Center -->
        <div class="space-y-5">
            <div class="text-left space-y-1">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-600">AI VIDEO WEAVE</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest">Tokenless Cloud Engine • Instant Render</p>
            </div>
            
            <div class="glass-panel p-4 rounded-xl grid grid-cols-2 gap-3 mt-4">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-400">VIDEO FORMAT</label>
                    <select id="frameSize" class="w-full p-2.5 bg-gray-900 rounded-lg border border-gray-700 text-sm outline-none text-cyan-100">
                        <option value="1920x1080">YouTube / Web (16:9)</option>
                        <option value="1080x1920">Reels / Shorts (9:16)</option>
                        <option value="1080x1080">Instagram Square (1:1)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-400">ART DIRECTION</label>
                    <select id="artStyle" class="w-full p-2.5 bg-gray-900 rounded-lg border border-gray-700 text-sm outline-none text-cyan-100">
                        <option value="cinematic movie scene, unreal engine 5, masterpiece, 8k resolution, highly detailed">Cinematic Realism</option>
                        <option value="Scientific microscopic 3D render, highly detailed, educational visualization, macro photography">Scientific / Macro</option>
                        <option value="cute Disney Pixar 3D animation style, vibrant lighting, highly detailed">3D Animation</option>
                        <option value="Futuristic sci-fi cyberpunk, neon lights, highly detailed concept art">Sci-Fi / Cyberpunk</option>
                    </select>
                </div>
            </div>

            <div class="glass-panel p-4 rounded-xl">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-bold text-cyan-300">DIRECTOR's SCRIPT (Prompt):</label>
                    <button onclick="clearWorkspace()" class="text-xs text-red-400 hover:text-red-300 font-bold px-2 py-1 rounded bg-red-900/30">🗑️ Clear</button>
                </div>
                
                <textarea id="prompt" class="w-full p-3 bg-gray-900 rounded-lg border border-gray-700 focus:border-cyan-500 outline-none h-28 text-sm" placeholder="Type your scene here... (e.g., A glowing human brain with digital neural networks firing)"></textarea>
                
                <button onclick="generateTokenlessVideo()" id="generateBtn" class="mt-4 w-full bg-gradient-to-r from-cyan-600 to-purple-600 hover:from-cyan-500 hover:to-purple-500 p-4 rounded-lg font-bold text-white transition-all shadow-lg flex justify-center items-center gap-2 text-lg">
                    🚀 Render Video Instantly
                </button>
                <p id="statusText" class="text-sm mt-3 text-center hidden font-bold tracking-wide"></p>
            </div>
        </div>

        <!-- Right Column: Output Monitor -->
        <div class="glass-panel p-4 rounded-xl flex flex-col h-full min-h-[400px]">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-bold text-cyan-300">🖥️ Output Monitor</h2>
                <span class="text-[10px] bg-green-900/40 text-green-400 px-2 py-1 rounded border border-green-800/50 uppercase tracking-widest">Auto-Scale Mode</span>
            </div>
            
            <div id="videoContainer" class="w-full bg-black rounded-lg flex items-center justify-center border border-gray-800 relative overflow-hidden flex-1 shadow-inner ratio-16-9">
                <span class="text-gray-700 font-bold tracking-widest z-10 text-sm">SYSTEM READY</span>
                <img id="renderedVideo" class="absolute inset-0 w-full h-full object-cover hidden" src="" alt="Generated Frame">
            </div>
        </div>
        
    </div>

    <script>
        let currentObjectUrl = null; 

        // Update container size dynamically based on selection
        document.getElementById('frameSize').addEventListener('change', function() {
            const size = this.value;
            const container = document.getElementById('videoContainer');
            container.className = `w-full bg-black rounded-lg flex items-center justify-center border border-gray-800 relative overflow-hidden flex-1 shadow-inner`;
            if(size === "1920x1080") container.classList.add("ratio-16-9");
            if(size === "1080x1920") container.classList.add("ratio-9-16");
            if(size === "1080x1080") container.classList.add("ratio-1-1");
        });

        function clearWorkspace() {
            document.getElementById('prompt').value = '';
            document.getElementById('renderedVideo').classList.add('hidden');
            document.getElementById('renderedVideo').classList.remove('animate-cinematic-pan');
            document.getElementById('statusText').classList.add("hidden");
            window.speechSynthesis.cancel();
            
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
        }

        async function generateTokenlessVideo() {
            const rawPrompt = document.getElementById('prompt').value.trim();
            const style = document.getElementById('artStyle').value;
            const dimensions = document.getElementById('frameSize').value.split('x');
            const width = dimensions[0];
            const height = dimensions[1];
            
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('statusText');
            const imgElement = document.getElementById('renderedVideo');

            if (!rawPrompt) { alert("Please enter a Director's Script!"); return; }

            // Clear old memory
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            window.speechSynthesis.cancel();
            
            // UI State
            btn.disabled = true;
            btn.innerHTML = "⏳ Generating Fast Cloud Render...";
            status.classList.remove("hidden", "text-red-400", "text-cyan-400");
            status.classList.add("text-yellow-400");
            status.innerText = "Connecting to global rendering network... (No tokens needed)";
            imgElement.classList.add('hidden');
            imgElement.classList.remove('animate-cinematic-pan');

            // Build magical tokenless URL
            const finalPrompt = encodeURIComponent(`${rawPrompt}, ${style}`);
            // Adding a random seed makes sure we don't get cached images
            const randomSeed = Math.floor(Math.random() * 100000);
            const imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=${width}&height=${height}&seed=${randomSeed}&nologo=true`;

            try {
                // Fetch the image as a blob for zero-RAM management
                const response = await fetch(imageUrl);
                if (!response.ok) throw new Error("Render failed");
                
                const blob = await response.blob();
                currentObjectUrl = URL.createObjectURL(blob);
                
                status.innerText = "Applying Cinematic Motion & Voiceover...";
                imgElement.src = currentObjectUrl;
                imgElement.classList.remove('hidden');
                
                // Start animation and audio
                setTimeout(() => {
                    imgElement.classList.add('animate-cinematic-pan');
                    
                    const speech = new SpeechSynthesisUtterance(rawPrompt);
                    speech.lang = 'en-US';
                    speech.rate = 0.95; // slightly cinematic speed
                    window.speechSynthesis.speak(speech);

                    status.innerText = "✅ Cinematic Render Complete!";
                    status.classList.replace("text-yellow-400", "text-cyan-400");
                    btn.disabled = false;
                    btn.innerHTML = "🚀 Render New Video";
                }, 300);

            } catch (error) {
                status.innerText = "❌ Something went wrong. Please try again.";
                status.classList.replace("text-yellow-400", "text-red-400");
                btn.disabled = false;
                btn.innerHTML = "🔄 Retry Render";
            }
        }
    </script>
</body>
    </html>
