<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Weave Studio - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f111a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">AI VIDEO WEAVE STUDIO</h1>
            <p class="text-sm text-gray-400">Professional Text-to-Video Production Suite (Smart Fallback Enabled)</p>
        </div>
        
        <!-- API & Controls Section -->
        <div class="glass-panel p-5 rounded-xl flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-sm font-semibold mb-2 text-purple-300">🛡️ Secured API Access (Hugging Face):</label>
                <input type="password" id="apiToken" class="w-full p-3 bg-gray-900 rounded-lg border border-gray-700 focus:border-purple-500 outline-none" placeholder="Enter hf_... token here">
            </div>
            <button onclick="saveToken()" class="w-full md:w-auto bg-green-600 hover:bg-green-500 px-6 py-3 rounded-lg font-bold transition-colors">
                Save Token
            </button>
            <button onclick="clearWorkspace()" class="w-full md:w-auto bg-red-600 hover:bg-red-500 px-6 py-3 rounded-lg font-bold transition-colors">
                Clear Workspace
            </button>
        </div>

        <!-- Prompt Section -->
        <div class="glass-panel p-5 rounded-xl">
            <label class="block text-sm font-semibold mb-2 text-purple-300">🎬 VISUAL SCRIPT (Prompt):</label>
            <textarea id="prompt" class="w-full p-4 bg-gray-900 rounded-lg border border-gray-700 focus:border-purple-500 outline-none h-32" placeholder="Describe your cinematic scene in detail..."></textarea>
            
            <button onclick="generateVideo()" id="generateBtn" class="mt-4 w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 p-4 rounded-lg font-bold text-lg transition-all shadow-lg">
                ✨ Generate Video
            </button>
            <p id="statusText" class="text-sm mt-3 text-center hidden font-medium"></p>
        </div>

        <!-- Studio Monitor -->
        <div class="glass-panel p-5 rounded-xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-bold text-purple-300">📺 Studio Monitor</h2>
                <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">Resolution: 576x320</span>
            </div>
            <div id="videoContainer" class="w-full h-80 bg-black rounded-lg flex items-center justify-center border-2 border-dashed border-gray-700 relative overflow-hidden">
                <span class="text-gray-600 font-semibold tracking-widest">OUTPUT PREVIEW</span>
            </div>
        </div>
    </div>

    <script>
        // Check for saved token on load
        window.onload = () => {
            if(localStorage.getItem('hf_token')) {
                document.getElementById('apiToken').value = localStorage.getItem('hf_token');
            }
        };

        function saveToken() {
            const token = document.getElementById('apiToken').value.trim();
            if(token) {
                localStorage.setItem('hf_token', token);
                alert("Token saved securely in your browser!");
            } else {
                alert("Please enter a token first.");
            }
        }

        function clearWorkspace() {
            document.getElementById('prompt').value = '';
            document.getElementById('videoContainer').innerHTML = '<span class="text-gray-600 font-semibold tracking-widest">OUTPUT PREVIEW</span>';
            const status = document.getElementById('statusText');
            status.classList.add("hidden");
        }

        // Smart Models Fallback List
        const videoModels = [
            "damo-vilab/text-to-video-ms-1.7b",
            "cerspense/zeroscope_v2_576w",
            "ByteDance/AnimateDiff-Lightning"
        ];

        async function generateVideo() {
            const token = document.getElementById('apiToken').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('statusText');
            const videoContainer = document.getElementById('videoContainer');

            if (!token) { alert("Security Token required! Please enter and save your token."); return; }
            if (!prompt) { alert("Script cannot be empty! Please write a prompt."); return; }

            btn.disabled = true;
            btn.innerHTML = "⏳ Processing Video (Multi-Model Search)...";
            status.classList.remove("hidden", "text-red-400", "text-green-400");
            status.classList.add("text-yellow-400");
            videoContainer.innerHTML = `<div class="flex flex-col items-center"><div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div><span class="text-yellow-400 font-mono">Pinging AI Clusters...</span></div>`;

            let success = false;

            for (let i = 0; i < videoModels.length; i++) {
                if (success) break;
                
                status.innerText = `Attempt ${i + 1}/${videoModels.length}: Routing to [${videoModels[i].split('/')[1]}]...`;
                
                try {
                    const response = await fetch(`https://api-inference.huggingface.co/models/${videoModels[i]}`, {
                        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt }),
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const videoUrl = URL.createObjectURL(blob);
                        videoContainer.innerHTML = `<video src="${videoUrl}" controls autoplay loop class="w-full h-full object-contain rounded-lg shadow-2xl"></video>`;
                        status.innerText = `✅ Success! Generated using ${videoModels[i].split('/')[1]}`;
                        status.classList.replace("text-yellow-400", "text-green-400");
                        success = true;
                    }
                } catch (error) {
                    console.log(`Failed to reach ${videoModels[i]}`);
                }
            }

            if (!success) {
                videoContainer.innerHTML = `<div class="text-center p-6"><span class="text-5xl mb-4 block">⚠️</span><span class="text-red-400 font-bold block mb-2">API Overload Detected</span><span class="text-sm text-gray-400">All free servers are currently busy rendering other users' videos. Please try again in 5-10 minutes.</span></div>`;
                status.innerText = "Operation Failed: Server Timeout.";
                status.classList.replace("text-yellow-400", "text-red-400");
            }

            btn.disabled = false;
            btn.innerHTML = "✨ Generate Video";
        }
    </script>
</body>
                </html>
