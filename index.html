<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Weave Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">

    <div class="max-w-3xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-purple-400">AI Video Weave Studio</h1>
        
        <!-- API Key Section -->
        <div class="bg-gray-800 p-4 rounded-lg">
            <label class="block text-sm mb-2">Secured API Access (Hugging Face Token):</label>
            <input type="password" id="apiToken" class="w-full p-2 bg-gray-700 rounded mb-2" placeholder="hf_...">
        </div>

        <!-- Prompt Section -->
        <div class="bg-gray-800 p-4 rounded-lg">
            <label class="block text-sm mb-2">VISUAL SCRIPT (Prompt):</label>
            <textarea id="prompt" class="w-full p-2 bg-gray-700 rounded h-24" placeholder="Describe your video here..."></textarea>
            
            <button onclick="generateVideo()" id="generateBtn" class="mt-4 w-full bg-purple-600 hover:bg-purple-700 p-3 rounded font-bold transition-all">
                🎬 Generate Video
            </button>
            <p id="statusText" class="text-sm text-yellow-400 mt-2 text-center hidden">Initializing Smart Models... Please wait up to 3 minutes.</p>
        </div>

        <!-- Video Player Section -->
        <div class="bg-gray-800 p-4 rounded-lg">
            <h2 class="text-xl font-semibold mb-2">Studio Monitor</h2>
            <div id="videoContainer" class="w-full h-64 bg-black rounded flex items-center justify-center border border-gray-700">
                <span class="text-gray-500">Output Preview</span>
            </div>
        </div>
    </div>

    <script>
        // স্মার্ট মডেল ফলব্যাক লিস্ট (৩টি আলাদা মডেল)
        const videoModels = [
            "damo-vilab/text-to-video-ms-1.7b",
            "cerspense/zeroscope_v2_576w",
            "ByteDance/AnimateDiff-Lightning"
        ];

        async function generateVideo() {
            const token = document.getElementById('apiToken').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('statusText');
            const videoContainer = document.getElementById('videoContainer');

            if (!token) { alert("Please enter your Hugging Face Token!"); return; }
            if (!prompt) { alert("Script required! Please enter a prompt."); return; }

            btn.disabled = true;
            btn.innerHTML = "⏳ Processing (Auto-Retry Active)...";
            status.classList.remove("hidden");
            videoContainer.innerHTML = `<span class="text-yellow-500 animate-pulse">Communicating with AI Servers...</span>`;

            let success = false;

            // ফলব্যাক লুপ: একটি মডেল কাজ না করলে অন্যটিতে চেষ্টা করবে
            for (let i = 0; i < videoModels.length; i++) {
                if (success) break;
                
                status.innerText = `Trying Model ${i + 1}/${videoModels.length}: ${videoModels[i]}...`;
                
                try {
                    const response = await fetch(`https://api-inference.huggingface.co/models/${videoModels[i]}`, {
                        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt }),
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const videoUrl = URL.createObjectURL(blob);
                        videoContainer.innerHTML = `<video src="${videoUrl}" controls class="w-full h-full object-contain rounded"></video>`;
                        status.innerText = "✅ Video Generated Successfully!";
                        status.classList.replace("text-yellow-400", "text-green-400");
                        success = true;
                    } else {
                        console.log(`Model ${videoModels[i]} failed or is asleep.`);
                    }
                } catch (error) {
                    console.log(`Error with model ${videoModels[i]}`);
                }
            }

            if (!success) {
                videoContainer.innerHTML = `<span class="text-red-500">❌ All models are currently busy. Please try again in 5 minutes.</span>`;
                status.innerText = "Timeout or Servers Overloaded.";
                status.classList.replace("text-yellow-400", "text-red-400");
            }

            btn.disabled = false;
            btn.innerHTML = "🎬 Generate Video";
        }
    </script>
</body>
</html>
