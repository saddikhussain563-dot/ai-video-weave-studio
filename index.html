<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Weave - Master Studio V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Advanced Cinematic Motions */
        @keyframes panRight { 0% { transform: scale(1.05) translateX(-2%); } 100% { transform: scale(1.05) translateX(2%); } }
        @keyframes zoomIn { 0% { transform: scale(1.0); } 100% { transform: scale(1.15); } }
        .anim-pan-right { animation: panRight 12s ease-in-out forwards; }
        .anim-zoom-in { animation: zoomIn 12s ease-in-out forwards; }
        
        .ratio-16-9 { aspect-ratio: 16 / 9; width: 100%; }
        
        /* CapCut Style Timeline Scrollbar */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
    </style>
</head>
<body class="p-3 md:p-6 text-sm">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-gray-800 pb-4 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500">AI VIDEO WEAVE</h1>
                <p class="text-[10px] md:text-xs text-gray-400 uppercase tracking-widest mt-1">V8 Master Engine • CapCut Style Timeline</p>
            </div>
            <button onclick="playMasterTimeline()" id="playMovieBtn" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-8 py-3 rounded-lg font-bold shadow-[0_0_20px_rgba(79,70,229,0.4)] transition-all hidden w-full md:w-auto">
                🎬 PLAY MASTER VIDEO
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left: Master Controller Form -->
            <div class="lg:col-span-6 space-y-4 glass-panel p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
                    <h2 class="text-lg font-bold text-indigo-300">🧠 Master AI Controller</h2>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold mb-1 text-gray-400 tracking-wider">VISUAL PROMPT (Image Generation):</label>
                    <textarea id="imagePrompt" class="w-full p-3 bg-gray-900 rounded-lg border border-gray-700 focus:border-indigo-500 outline-none h-20 text-sm" placeholder="Describe the scene... (e.g., A cinematic glowing forest)"></textarea>
                </div>

                <div>
                    <label class="block text-[10px] font-bold mb-1 text-pink-300 tracking-wider">AUDIO SCRIPT (NotebookLM Style Podcast/Narration):</label>
                    <textarea id="dialogue" class="w-full p-3 bg-gray-900 rounded-lg border border-gray-700 focus:border-pink-500 outline-none h-20 text-sm" placeholder="Type the narration or dialogue here..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold mb-1 text-gray-400 tracking-wider">VOICE ENGINE</label>
                        <select id="voiceSelect" class="w-full p-2.5 bg-gray-900 rounded-lg border border-gray-700 outline-none text-gray-200 text-xs">
                            <option value="male">Host 1 (Male)</option>
                            <option value="female">Host 2 (Female)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-1 text-gray-400 tracking-wider">MOTION AI</label>
                        <select id="cameraMotion" class="w-full p-2.5 bg-gray-900 rounded-lg border border-gray-700 outline-none text-gray-200 text-xs">
                            <option value="anim-zoom-in">Cinematic Zoom</option>
                            <option value="anim-pan-right">Smooth Pan</option>
                        </select>
                    </div>
                </div>

                <button onclick="orchestrateScene()" id="orchestrateBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 p-3 rounded-lg font-bold text-white transition-all shadow-lg mt-2">
                    ⚡ Generate & Sync to Timeline
                </button>
            </div>

            <!-- Right: Studio Monitor -->
            <div class="lg:col-span-6 glass-panel p-2 rounded-2xl flex flex-col border-gray-800">
                <div class="flex justify-between items-center px-4 py-2 bg-gray-900/50 rounded-t-xl">
                    <h2 class="text-xs font-bold text-gray-300 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Studio Monitor
                    </h2>
                </div>
                
                <div id="videoContainer" class="w-full bg-black rounded-b-xl flex items-center justify-center relative overflow-hidden flex-1 ratio-16-9">
                    <div id="loadingOverlay" class="absolute inset-0 bg-black/90 z-20 flex-col items-center justify-center hidden">
                        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                        <span class="text-indigo-400 text-[10px] font-bold tracking-widest animate-pulse" id="loadingText">MASTER AI PROCESSING...</span>
                    </div>
                    <span id="monitorPlaceholder" class="text-gray-700 font-bold tracking-[0.2em] z-10 text-xs">NO MEDIA</span>
                    <img id="renderedVideo" class="absolute inset-0 w-full h-full object-cover hidden" src="">
                </div>
            </div>
            
        </div>

        <!-- Bottom: CapCut Style Multi-Track Timeline -->
        <div class="glass-panel p-4 rounded-2xl overflow-hidden">
            <div class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                <h2 class="text-sm font-bold text-gray-200">🎬 Master Timeline (CapCut Layout)</h2>
                <button onclick="clearTimeline()" class="text-[10px] text-red-400 border border-red-900/50 px-2 py-1 rounded bg-red-900/20">Clear Workspace</button>
            </div>
            
            <div class="flex flex-col gap-2 overflow-x-auto pb-4" id="timelineContainer">
                
                <!-- Video Track -->
                <div class="flex items-center gap-2">
                    <div class="w-16 flex-shrink-0 text-[10px] text-indigo-400 font-bold text-right pr-2 border-r border-gray-700">VIDEO</div>
                    <div id="videoTrack" class="flex gap-1 min-w-max items-center h-16 bg-gray-900/50 p-1 rounded-lg border border-gray-800 flex-1">
                        <span class="text-gray-600 text-xs italic px-4" id="emptyVideoMsg">Video clips will appear here...</span>
                    </div>
                </div>

                <!-- Audio Track -->
                <div class="flex items-center gap-2">
                    <div class="w-16 flex-shrink-0 text-[10px] text-pink-400 font-bold text-right pr-2 border-r border-gray-700">AUDIO</div>
                    <div id="audioTrack" class="flex gap-1 min-w-max items-center h-10 bg-gray-900/50 p-1 rounded-lg border border-gray-800 flex-1">
                        <span class="text-gray-600 text-xs italic px-4" id="emptyAudioMsg">Audio waveforms will appear here...</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        let masterTimeline = [];
        let isPlaying = false;
        
        let voices = [];
        window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };

        async function orchestrateScene() {
            const prompt = document.getElementById('imagePrompt').value.trim();
            const dialogue = document.getElementById('dialogue').value.trim();
            const motion = document.getElementById('cameraMotion').value;
            const voiceType = document.getElementById('voiceSelect').value;
            
            if (!prompt) { alert("Visual Prompt is required!"); return; }

            const btn = document.getElementById('orchestrateBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            btn.disabled = true;
            loadingOverlay.classList.replace("hidden", "flex");

            // V2 Fast Core Engine Logic
            const finalPrompt = encodeURIComponent(prompt + ", masterpiece, highly detailed, 8k");
            const randomSeed = Math.floor(Math.random() * 999999);
            const imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1920&height=1080&seed=${randomSeed}&nologo=true`;

            try {
                const response = await fetch(imageUrl);
                if (!response.ok) throw new Error("API failed");
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const newScene = {
                    id: Date.now(),
                    url: blobUrl,
                    dialogue: dialogue,
                    motion: motion,
                    voiceType: voiceType
                };
                
                masterTimeline.push(newScene);
                renderCapCutTimeline();
                
            } catch (error) {
                alert("Cloud connection busy. Try again.");
            }

            loadingOverlay.classList.replace("flex", "hidden");
            btn.disabled = false;
        }

        function renderCapCutTimeline() {
            const vTrack = document.getElementById('videoTrack');
            const aTrack = document.getElementById('audioTrack');
            const playBtn = document.getElementById('playMovieBtn');
            
            if(masterTimeline.length > 0) {
                document.getElementById('emptyVideoMsg').style.display = 'none';
                document.getElementById('emptyAudioMsg').style.display = 'none';
                playBtn.classList.remove('hidden');
            } else {
                vTrack.innerHTML = '<span class="text-gray-600 text-xs italic px-4" id="emptyVideoMsg">Video clips will appear here...</span>';
                aTrack.innerHTML = '<span class="text-gray-600 text-xs italic px-4" id="emptyAudioMsg">Audio waveforms will appear here...</span>';
                playBtn.classList.add('hidden');
                return;
            }
            
            vTrack.innerHTML = '';
            aTrack.innerHTML = '';
            
            masterTimeline.forEach((scene, index) => {
                // Video Block
                const vBlock = document.createElement('div');
                vBlock.className = "h-full w-32 bg-indigo-900/40 border border-indigo-700 rounded overflow-hidden relative flex-shrink-0";
                vBlock.innerHTML = `
                    <img src="${scene.url}" class="w-full h-full object-cover opacity-80">
                    <span class="absolute top-1 left-1 bg-black/70 text-white text-[8px] px-1 rounded">V${index+1}</span>
                `;
                vTrack.appendChild(vBlock);

                // Audio Block (NotebookLM visual simulation)
                const aBlock = document.createElement('div');
                aBlock.className = "h-full w-32 bg-pink-900/30 border border-pink-800 rounded relative flex items-center justify-center flex-shrink-0 overflow-hidden";
                const isSilent = !scene.dialogue;
                aBlock.innerHTML = `
                    <span class="absolute top-0.5 left-1 text-pink-300 text-[8px]">${isSilent ? 'SILENT' : (scene.voiceType === 'male' ? 'HOST 1' : 'HOST 2')}</span>
                    ${isSilent ? '<div class="w-full h-[1px] bg-pink-900/50"></div>' : '<div class="flex gap-[2px] items-center h-4"><div class="w-1 h-2 bg-pink-500"></div><div class="w-1 h-4 bg-pink-400"></div><div class="w-1 h-3 bg-pink-500"></div><div class="w-1 h-2 bg-pink-600"></div></div>'}
                `;
                aTrack.appendChild(aBlock);
            });
        }

        function clearTimeline() {
            masterTimeline = [];
            renderCapCutTimeline();
            document.getElementById('renderedVideo').classList.add("hidden");
            document.getElementById('monitorPlaceholder').classList.remove("hidden");
            window.speechSynthesis.cancel();
        }

        async function playMasterTimeline() {
            if(masterTimeline.length === 0 || isPlaying) return;
            isPlaying = true;
            window.speechSynthesis.cancel();
            
            for(let i = 0; i < masterTimeline.length; i++) {
                await playEngine(masterTimeline[i]);
            }
            
            isPlaying = false;
            setTimeout(() => { 
                document.getElementById('renderedVideo').classList.add("hidden"); 
                document.getElementById('monitorPlaceholder').classList.remove("hidden"); 
            }, 1000);
        }

        function playEngine(scene) {
            return new Promise(async (resolve) => {
                const imgElement = document.getElementById('renderedVideo');
                const placeholder = document.getElementById('monitorPlaceholder');
                
                placeholder.classList.add("hidden");
                imgElement.src = scene.url;
                imgElement.className = 'absolute inset-0 w-full h-full object-cover hidden';
                imgElement.offsetHeight; 
                imgElement.className = `absolute inset-0 w-full h-full object-cover ${scene.motion}`;
                
                if(!scene.dialogue) {
                    setTimeout(resolve, 4000); 
                } else {
                    const speech = new SpeechSynthesisUtterance(scene.dialogue);
                    let selectedVoice = voices.find(v => v.lang.includes('en-US') && (scene.voiceType === 'female' ? v.name.toLowerCase().includes('female') : v.name.toLowerCase().includes('male')));
                    if(selectedVoice) speech.voice = selectedVoice;
                    speech.rate = 0.95; 
                    speech.onend = resolve;
                    speech.onerror = resolve; 
                    window.speechSynthesis.speak(speech);
                }
            });
        }
    </script>
</body>
                        </html>
